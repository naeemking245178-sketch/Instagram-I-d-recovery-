<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media UI Layout Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #262626;
            display: flex;
            justify-content: center;
        }

        .app-container {
            display: flex;
            max-width: 935px;
            width: 100%;
            margin-top: 30px;
            gap: 30px;
        }

        .main-feed {
            flex: 1;
            max-width: 470px;
        }

        .post-card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #0095f6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
        }

        .post-image {
            width: 100%;
            height: 400px;
            background-color: #eef2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8e8e8e;
            font-size: 16px;
        }

        .post-actions {
            padding: 12px;
            display: flex;
            gap: 16px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        .post-caption {
            padding: 0 12px 12px 12px;
            font-size: 14px;
        }

        .sidebar {
            width: 320px;
            display: none;
        }

        @media (min-width: 768px) {
            .sidebar {
                display: block;
            }
        }

        .profile-section {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .sidebar-title {
            color: #8e8e8e;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
        }
    </style>
</head>
